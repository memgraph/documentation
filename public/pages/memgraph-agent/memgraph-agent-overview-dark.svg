<text x="54" y="194" font-size="16" font-weight="600" fill="#F9F9F9">LLM</text>
<text x="54" y="216" font-size="13" fill="#BAB8BB">Cloud provider or local</text>
<text x="54" y="234" font-size="13" fill="#BAB8BB">OpenAI-compatible server</text>
<line x1="272" y1="205" x2="328" y2="205" stroke="#F9F9F9" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="730" y="160" width="240" height="90" rx="12" fill="#1A1718" stroke="#646265" stroke-width="1.5"/>
<text x="754" y="194" font-size="16" font-weight="600" fill="#F9F9F9">Memgraph</text>
<text x="754" y="216" font-size="13" fill="#BAB8BB">Over Bolt: queries, schema,</text>
<text x="754" y="234" font-size="13" fill="#BAB8BB">import and server health</text>
<line x1="672" y1="205" x2="728" y2="205" stroke="#F9F9F9" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="500" y1="262" x2="500" y2="318" stroke="#F9F9F9" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="516" y="295" font-size="13" fill="#BAB8BB">the model calls them when it needs them</text>
<rect x="30" y="320" width="940" height="240" rx="16" fill="#1A1718" stroke="#646265" stroke-width="1.5"/>
<text x="54" y="354" font-size="16" font-weight="700" fill="#F9F9F9">Tools</text>
