<text x="500" y="80" font-size="13" fill="#BAB8BB" text-anchor="middle">Chat, Cypher console, slash commands</text>
<line x1="500" y1="96" x2="500" y2="148" stroke="#F9F9F9" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="330" y="150" width="340" height="110" rx="14" fill="#231F20" stroke="#FB6E00" stroke-width="2"/>
