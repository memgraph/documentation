<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="'Inter Tight', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Memgraph Agent and what it connects to</title>
<desc id="desc">Memgraph Agent runs in your terminal between you and the services it uses. You talk to it through the chat, the Cypher console and slash commands. It sends your request to the LLM you chose, a cloud provider or a local server. It reaches Memgraph over Bolt to run queries, read the schema, import data and check the server. The model also calls tools: the Memgraph Docs MCP server to search the documentation, skills from memgraph/skills and your own folders, a memory document about you and your data, any MCP servers you connect, plugins and hooks, and scripts and background jobs in your working directory. Writes, scripts and file writes wait for your approval.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F9F9F9"/></marker></defs>
