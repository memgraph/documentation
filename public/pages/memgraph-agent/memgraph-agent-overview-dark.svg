<text x="500" y="208" font-size="13" fill="#BAB8BB" text-anchor="middle" font-family="'JetBrains Mono', Menlo, monospace">mgagent</text>
<text x="500" y="240" font-size="13" font-weight="600" fill="#FB6E00" text-anchor="middle">Asks before writes, scripts and file writes</text>
