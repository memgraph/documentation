<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="'Inter Tight', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">The Memgraph marketplace and its two plugins</title>
<desc id="desc">Claude Code or Codex adds the Memgraph marketplace, memgraph/marketplace, and installs plugins from it. The marketplace has two plugins of equal standing. The memgraph plugin adds Agent Skills, the Docs MCP server, which searches the Memgraph docs, the Memgraph MCP server, which reads your schema and runs queries on your Memgraph, read-only by default, and the memgraph-start onboarding, which starts Memgraph and Memgraph Lab in Docker and offers to set up AI memory. The context-graph plugin adds AI memory: hooks that record your sessions in Memgraph, memory and recall tools, and a setup skill. It needs the memgraph-context-graph tool, which its setup installs. Other agents, such as Cursor, can install the skills alone with npx skills add memgraph/skills.</desc>
