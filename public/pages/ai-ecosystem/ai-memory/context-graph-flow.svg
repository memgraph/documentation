<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1464" viewBox="0 0 1000 1464" font-family="'Inter Tight', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How Context Graph records and recalls agent sessions</title>
  <desc id="desc">During a session, the memgraph-context-graph hooks in the agent, a coding agent or an Agent SDK app, drop private text and redact secrets, and the actions-graph, skills-graph and sessions-graph connectors write the session to Memgraph as a graph of users, sessions, actions, skills and memories. The optional resources-graph connector records GitHub resources, and context-graph-spaces adds shared spaces on Memgraph Enterprise. The MCP server reads Memgraph and serves the recall and memory tools to the agent. After a session, reconciliation filters the text through the HyGM ontology, extracts entities and facts with GLiNER2 and stores them in Memgraph with their embeddings. Only optional schema learning sends session text to an Anthropic or OpenAI API.</desc>
