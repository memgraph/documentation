    @keyframes h-memgraph { 0.00% { opacity: 0; } 26.67% { opacity: 0; } 28.33% { opacity: 1; } 36.67% { opacity: 1; } 38.33% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes h-recon { 0.00% { opacity: 0; } 41.67% { opacity: 0; } 43.33% { opacity: 1; } 66.67% { opacity: 1; } 68.33% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes h-onto { 0.00% { opacity: 0; } 42.50% { opacity: 0; } 44.17% { opacity: 1; } 48.33% { opacity: 1; } 50.00% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes h-extract { 0.00% { opacity: 0; } 51.67% { opacity: 0; } 53.33% { opacity: 1; } 56.67% { opacity: 1; } 58.33% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes h-store { 0.00% { opacity: 0; } 60.00% { opacity: 0; } 61.67% { opacity: 1; } 65.00% { opacity: 1; } 66.67% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes h-mcp { 0.00% { opacity: 0; } 81.67% { opacity: 0; } 83.33% { opacity: 1; } 87.50% { opacity: 1; } 89.17% { opacity: 0; } 100.00% { opacity: 0; } }
    @keyframes kg { 0.00% { opacity: 0.3; } 73.33% { opacity: 0.3; } 76.67% { opacity: 1; } 95.83% { opacity: 1; } 99.17% { opacity: 0.3; } 100.00% { opacity: 0.3; } }
  </style>
