      .h-agent { animation: h-agent 12s linear infinite; }
      .h-capture { animation: h-capture 12s linear infinite; }
      .h-memgraph { animation: h-memgraph 12s linear infinite; }
      .h-recon { animation: h-recon 12s linear infinite; }
      .h-onto { animation: h-onto 12s linear infinite; }
      .h-extract { animation: h-extract 12s linear infinite; }
      .h-store { animation: h-store 12s linear infinite; }
      .h-mcp { animation: h-mcp 12s linear infinite; }
      .kg { animation: kg 12s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow { display: none; }
    }
