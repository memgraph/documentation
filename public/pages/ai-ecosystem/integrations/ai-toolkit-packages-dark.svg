<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="396" viewBox="0 0 1000 396" font-family="'Inter Tight', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Memgraph AI Toolkit packages and third-party integrations</title>
  <desc id="desc">The Memgraph AI Toolkit packages stacked on Memgraph, each built on the ones below it. Context Graph is built on unstructured2graph, which is built on hygm and lightrag-memgraph. lightrag-memgraph, mcp-memgraph, langchain-memgraph and SQL2Graph are built on memgraph-toolbox, which connects to Memgraph. hygm defines a graph schema and does not connect to Memgraph. LlamaIndex, Cognee and Mem0 are third-party integrations that connect to Memgraph directly.</desc>
  <rect x="0" y="0" width="1000" height="396" rx="8" fill="#1A1718"/>

  <rect x="24" y="40" width="684" height="252" rx="8" fill="none" stroke="#646265" stroke-dasharray="6 4"/>
  <text x="44" y="66" font-size="12" font-weight="600" letter-spacing="0.72" fill="#BAB8BB">MEMGRAPH AI TOOLKIT</text>
  <text x="688" y="66" font-size="13" fill="#9A949C" text-anchor="end">Each package is built on the ones below it</text>
  <rect x="44" y="88" width="232" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="160" y="113" font-size="15" font-weight="600" fill="#F9F9F9" text-anchor="middle">Context Graph</text>
  <rect x="44" y="136" width="232" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="160" y="161" font-size="14" font-family="'Ubuntu Mono', Consolas, monospace" fill="#F9F9F9" text-anchor="middle">unstructured2graph</text>
  <rect x="44" y="184" width="84" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="86" y="209" font-size="14" font-family="'Ubuntu Mono', Consolas, monospace" fill="#F9F9F9" text-anchor="middle">hygm</text>
  <rect x="136" y="184" width="140" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="206" y="209" font-size="14" font-family="'Ubuntu Mono', Consolas, monospace" fill="#F9F9F9" text-anchor="middle">lightrag-memgraph</text>
  <rect x="284" y="184" width="116" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="342" y="209" font-size="14" font-family="'Ubuntu Mono', Consolas, monospace" fill="#F9F9F9" text-anchor="middle">mcp-memgraph</text>
  <rect x="408" y="184" width="148" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="482" y="209" font-size="14" font-family="'Ubuntu Mono', Consolas, monospace" fill="#F9F9F9" text-anchor="middle">langchain-memgraph</text>
  <rect x="564" y="184" width="124" height="40" rx="4" fill="#231F20" stroke="#3E3A3C"/>
  <text x="626" y="209" font-size="15" font-weight="600" fill="#F9F9F9" text-anchor="middle">SQL2Graph</text>
  <rect x="136" y="232" width="552" height="40" rx="4" fill="#231F20" stroke="#646265"/>
  <text x="412" y="257" font-size="15" font-family="'Ubuntu Mono', Consolas, monospace" font-weight="700" fill="#F9F9F9" text-anchor="middle">memgraph-toolbox</text>

  <rect x="724" y="40" width="252" height="252" rx="8" fill="none" stroke="#646265" stroke-dasharray="6 4"/>
  <text x="744" y="66" font-size="12" font-weight="600" letter-spacing="0.72" fill="#BAB8BB">THIRD-PARTY INTEGRATIONS</text>
  <text x="744" y="113" font-size="13" fill="#9A949C">Connect to Memgraph directly</text>
  <rect x="744" y="136" width="212" height="40" rx="4" fill="#231F20" stroke="#646265" stroke-dasharray="4 3"/>
  <text x="850" y="161" font-size="15" font-weight="600" fill="#BAB8BB" text-anchor="middle">LlamaIndex</text>
  <rect x="744" y="184" width="212" height="40" rx="4" fill="#231F20" stroke="#646265" stroke-dasharray="4 3"/>
  <text x="850" y="209" font-size="15" font-weight="600" fill="#BAB8BB" text-anchor="middle">Cognee</text>
  <rect x="744" y="232" width="212" height="40" rx="4" fill="#231F20" stroke="#646265" stroke-dasharray="4 3"/>
  <text x="850" y="257" font-size="15" font-weight="600" fill="#BAB8BB" text-anchor="middle">Mem0 1.x</text>

  <rect x="24" y="316" width="952" height="56" rx="8" fill="#231F20" stroke="#646265"/>
  <rect x="24" y="316" width="952" height="4" rx="2" fill="#FB6E00"/>
  <text x="500" y="351" font-size="20" font-weight="700" fill="#F9F9F9" text-anchor="middle">Memgraph</text>
</svg>
