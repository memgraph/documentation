  <text x="300" y="132" font-family="'Ubuntu Mono', Consolas, monospace" font-size="16" fill="#231F20">unstructured2graph</text>
  <text x="300" y="156" font-size="13" fill="#646265">Documents to a graph</text>
  <rect x="520" y="100" width="220" height="76" rx="6" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="536" y="132" font-family="'Ubuntu Mono', Consolas, monospace" font-size="16" fill="#231F20">structured2graph</text>
  <text x="536" y="156" font-size="13" fill="#646265">SQL databases to a graph</text>
