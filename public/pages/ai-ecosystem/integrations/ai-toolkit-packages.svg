<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="316" viewBox="0 0 1024 316" font-family="'Inter Tight', Inter, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Memgraph AI Toolkit packages</title>
  <desc id="desc">The packages in the Memgraph AI Toolkit and what each is for. Context Graph (AI memory for coding agents); unstructured2graph (Documents to a graph); structured2graph (SQL databases to a graph); hygm (Graph schema and validation); mcp-memgraph (MCP server for Memgraph); langchain-memgraph (LangChain integration); lightrag-memgraph (LightRAG graph storage); memgraph-toolbox (Python tools for Memgraph).</desc>
