name: Docs checks

on:
  pull_request:
  push:
    branches: [main]
  # "Run workflow" in the Actions tab: runs the examples on every page.
  workflow_dispatch:
    inputs:
      image:
        description: Memgraph MAGE image (default is the newest release in the release notes)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  links-and-sidebar:
    name: Links, redirects and sidebar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-docs.mjs

  examples-and-names:
    name: Examples and names
    # Only PRs into main: docs on a release branch describe a Memgraph that isn't out yet, so
    # their examples are checked when the release branch is merged into main.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # The pages this PR changes: their Cypher examples run on the latest Memgraph, and the names in them are checked.
      - run: python3 scripts/check-examples.py --base HEAD^1
        env:
          MEMGRAPH_ENTERPRISE_LICENSE: ${{ secrets.MEMGRAPH_ENTERPRISE_LICENSE }}
          MEMGRAPH_ORGANIZATION_NAME: ${{ secrets.MEMGRAPH_ORGANIZATION_NAME }}

  all-examples:
    name: Examples and names on every page
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-examples.py --all ${IMAGE:+--image "$IMAGE"}
        env:
          IMAGE: ${{ inputs.image }}
          MEMGRAPH_ENTERPRISE_LICENSE: ${{ secrets.MEMGRAPH_ENTERPRISE_LICENSE }}
          MEMGRAPH_ORGANIZATION_NAME: ${{ secrets.MEMGRAPH_ORGANIZATION_NAME }}
